<!doctype html>
<html lang="{{ page.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | escape }}">
  <title>{{ page.title | escape }} · {{ site.title }}</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/jpeg" href="photo.jpg">
  <link rel="alternate" hreflang="{{ page.other_lang }}" href="{{ page.translation }}">
</head>
<body>
  <a class="skip" href="#contenu">{% if page.lang == 'fr' %}Aller au contenu{% else %}Skip to content{% endif %}</a>
  <div class="site">
    <div class="sidebar">
      {% include header.html %}
      {% include navigation.html %}
    </div>
    <main id="contenu" tabindex="-1">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
</body>
</html>
